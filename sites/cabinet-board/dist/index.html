<!doctype html>
<html lang="ru" data-bg="grey"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#e4e7ec"><meta name="description" content="Личная доска с виджетами, папками и пространством для главного."><title>Кабинет — личная доска</title><link rel="icon" href="./icons/icon-32.png" sizes="32x32"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Кабинет"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><div class="app-shell">
<main class="main"><nav id="breadcrumbs" class="floating-breadcrumbs" aria-label="Навигация по папкам" hidden></nav>
<section id="board" class="board" aria-label="Доска с виджетами"><div id="world" class="world"></div><div id="board-empty" class="board-empty" hidden><div class="empty-glass-art" aria-hidden="true"><span class="empty-pane pane-back"></span><span class="empty-pane pane-front"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div><h2>Место для главного</h2><p>Начни с одной заметки, задачи или папки.<br>Остальное добавишь, когда понадобится.</p><button class="button primary" id="empty-add">Добавить первую карточку</button><p class="empty-tip">Действия с карточкой — в её меню ⋯.</p></div></section>
<section id="inspector" class="inspector" aria-label="Параметры виджета" hidden><label>Название<input id="item-title" maxlength="160" enterkeyhint="done"></label><label>Ширина<input id="item-width" type="number" inputmode="numeric" min="220" max="1600"></label><label>Высота<input id="item-height" type="number" inputmode="numeric" min="170" max="1600"></label><label>Поворот<input id="item-angle" type="number" inputmode="numeric" step="1"></label><div class="inspector-actions"><button id="move" class="button">В папку…</button><button id="duplicate" class="icon-button" aria-label="Дублировать виджет" title="Дублировать">⧉</button><button id="front" class="icon-button" aria-label="На передний план" title="На передний план">↑</button><button id="delete" class="icon-button danger" aria-label="Удалить виджет" title="Удалить">×</button><button id="close-inspector" class="text-button">Готово</button></div></section>
<section id="detail" class="detail" aria-labelledby="page-title" hidden>
  <header class="detail-header">
    <button class="text-button" id="back" aria-label="Назад"></button>
    <button class="text-button" id="detail-lock" aria-label="Заблокировать карточки" title="Заблокировать карточки" hidden></button>
    <h1 id="page-title" tabindex="-1"></h1>
  </header>
  <div id="detail-content" class="detail-content"></div>
</section>
<div id="status" class="toast" role="status" aria-live="polite"></div>
</main></div>
<nav class="workspace-dock" aria-label="Инструменты доски">
<button class="icon-button" id="board-menu" aria-label="Меню" title="Меню" aria-haspopup="dialog">☰</button>
<button class="icon-button dock-add" id="add-widget" aria-label="Добавить виджет" title="Добавить виджет">＋</button>
<button class="icon-button" id="dock-fit" aria-label="Показать все карточки" title="Показать все карточки"></button>
<button class="icon-button" id="fullscreen" aria-label="На весь экран" title="На весь экран" aria-pressed="false">⤢</button>
</nav>
<dialog id="board-options" class="modal small board-menu" aria-labelledby="board-options-title"><div class="modal-heading"><h2 id="board-options-title">Меню</h2><button class="icon-button" data-close aria-label="Закрыть меню">×</button></div>
<section class="menu-section"><h3>Доски</h3><nav id="navigation" aria-label="Мои доски"></nav></section>
<section class="menu-section" id="board-toolbar"><h3>Вид</h3>
<div class="menu-row"><div class="view-switch" role="group" aria-label="Вид доски"><button id="view-canvas" aria-pressed="true">Доска</button><button id="view-list" aria-pressed="false">Список</button></div><span id="count" class="muted"></span></div>
<div class="canvas-controls" id="canvas-controls"><div class="zoom-stepper" role="group" aria-label="Масштаб"><button class="icon-button" id="zoom-out" aria-label="Уменьшить масштаб">−</button><output id="zoom-value">100%</output><button class="icon-button" id="zoom-in" aria-label="Увеличить масштаб">+</button></div><button class="button" id="fit">Показать всё</button><button class="icon-button" id="pan-mode" aria-pressed="false" aria-label="Двигать поле мышью" title="Двигать поле мышью">✥</button></div>
<div class="menu-row menu-row-stack"><span class="menu-label" id="bg-label">Фон доски</span><div class="swatch-row" id="bg-swatches" role="group" aria-labelledby="bg-label"></div></div>
<p id="board-help" class="modal-footnote"></p>
<button class="menu-item" id="undo" disabled><span class="menu-item-icon" aria-hidden="true"></span>Отменить последнее изменение</button></section>
<section class="menu-section"><h3>Защита</h3><div class="pin-actions"><button class="menu-item" id="pin-settings"><span class="menu-item-icon" aria-hidden="true"></span><span id="pin-settings-label">Настроить PIN</span></button><button class="menu-item" id="pin-lock-all" hidden><span class="menu-item-icon" aria-hidden="true"></span>Заблокировать карточки</button></div></section>
<section class="menu-section"><h3>Данные</h3><p class="save-status" id="save-status" role="status">Сохранено в браузере</p>
<div class="cloud-actions" id="cloud-actions" hidden><button class="menu-item" id="drive-connect"><span class="menu-item-icon" aria-hidden="true"></span>Подключить Google Диск</button><button class="menu-item" id="drive-signin" hidden><span class="menu-item-icon" aria-hidden="true"></span>Войти в Google</button><button class="menu-item" id="drive-disconnect" hidden><span class="menu-item-icon" aria-hidden="true"></span>Отключить Google Диск</button></div>
<div class="file-actions"><button class="menu-item" id="export"><span class="menu-item-icon" aria-hidden="true"></span>Сохранить копию в файл</button><button class="menu-item" id="import"><span class="menu-item-icon" aria-hidden="true"></span>Загрузить доску из файла</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></section></dialog>
<dialog id="catalog" class="modal" aria-labelledby="catalog-title"><div class="modal-heading"><h2 id="catalog-title">Добавить на доску</h2><button class="icon-button" data-close aria-label="Закрыть каталог">×</button></div><div id="catalog-grid" class="catalog-grid"></div></dialog>
<dialog id="move-dialog" class="modal small"><div class="modal-heading"><h2>Переместить в папку</h2><button class="icon-button" data-close aria-label="Закрыть">×</button></div><div id="move-destinations"></div></dialog>
<dialog id="confirm-dialog" class="modal small"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="modal-actions"><button class="button" data-close>Отмена</button><button class="button primary" id="confirm-action">Продолжить</button></div></dialog>
<dialog id="pin-dialog" class="modal small" aria-labelledby="pin-title">
  <div class="modal-heading"><h2 id="pin-title">PIN-код</h2><button class="icon-button" type="button" data-close aria-label="Закрыть окно PIN">×</button></div>
  <form class="pin-form">
    <p id="pin-hint"></p>
    <label class="field"><span>PIN-код</span><input id="pin-current" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="current-password"></label>
    <label class="field"><span>Новый PIN</span><input id="pin-new" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="new-password"></label>
    <label class="field"><span>Повтори новый PIN</span><input id="pin-repeat" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="new-password"></label>
    <p id="pin-error" role="alert"></p>
    <div class="modal-actions"><button class="button primary" type="submit">Подтвердить</button></div>
  </form>
</dialog>
<noscript>Для работы доски нужен JavaScript.</noscript>
</body></html>
